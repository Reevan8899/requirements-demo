name: Traceability Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_low_coverage:
        description: 'Демонстрация отказа при покрытии ниже 80%'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests with 80% coverage gate
        if: ${{ !inputs.simulate_low_coverage }}
        run: python -m pytest -v --cov=src --cov-report=term-missing --cov-fail-under=80
      - name: Demonstrate rejection below 80%
        if: ${{ inputs.simulate_low_coverage }}
        run: python -m pytest -k test_fr002_empty --cov=src --cov-fail-under=80
      - name: Check traceability
        if: ${{ !cancelled() }}
        run: python scripts/check_traceability.py --report docs/traceability-report.md
      - name: Upload traceability report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report
          path: docs/traceability-report.md
          if-no-files-found: error
      - name: Comment on failed pull request checks
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Проверки PR завершились ошибкой. Откройте журнал Actions и отчёт traceability-report, чтобы увидеть причину.'
            })
